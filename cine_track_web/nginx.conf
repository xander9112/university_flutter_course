server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Имена файлов сборки Flutter не содержат хэшей (main.dart.js, flutter_bootstrap.js…),
    # поэтому браузер должен перепроверять их при каждом открытии — иначе после деплоя
    # пользователи получат смесь старых и новых файлов. Повторная загрузка всё равно дешёвая:
    # nginx ответит 304 по ETag.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }
}
