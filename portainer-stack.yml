# Стек CineTrack для Portainer (Stacks → Add stack → Web editor).
# Образы собираются и пушатся с Mac в registry.xander9112.keenetic.link через ./deploy.sh api
# и ./deploy.sh web (как это сделать — cine_track_api/README.md, раздел «Деплой»).
# После каждого ./deploy.sh обновите теги образов ниже.
#
# Переменные окружения стека (Stacks → Environment variables):
#   POSTGRES_PASSWORD   — пароль базы
#   PAYLOAD_SECRET      — любая длинная случайная строка (openssl rand -base64 32); подписывает
#                         сессии админки, при смене все входы сбрасываются
#   TMDB_IMPORT_ACCESS_TOKEN — необязательно: API Read Access Token TMDB для кнопок импорта
#                         в админке («100 лучших за 40 лет», «Популярные»); вместо него можно
#                         задать TMDB_IMPORT_API_KEY (API Key v3)
#   NODE_USE_ENV_PROXY, HTTPS_PROXY — необязательно: прокси для импорта, если сервер не достаёт
#                         до TMDB напрямую (NODE_USE_ENV_PROXY=1, HTTPS_PROXY=http://host:port)
#
# Nginx Proxy Manager: один Proxy Host cine-track.xander9112.keenetic.link → порт 5210 (web),
# HTTPS через Let's Encrypt, без Custom locations. nginx веб-версии сам проксирует пути API
# (/3, /t/p, /admin, /api, /_next) в контейнер api — веб-версия, API и админка
# (https://cine-track.xander9112.keenetic.link/admin) живут на одном домене.
# Порт 5200 (api напрямую) для NPM не нужен — он оставлен для отладки из локальной сети.

services:
  db:
    image: postgres:17-alpine
    container_name: cinetrack_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cinetrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cinetrack
    volumes:
      - cinetrack_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinetrack -d cinetrack"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cinetrack

  api:
    image: registry.xander9112.keenetic.link/cinetrack-api:1.2.1
    container_name: cinetrack_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://cinetrack:${POSTGRES_PASSWORD}@db:5432/cinetrack
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      TMDB_IMPORT_ACCESS_TOKEN: ${TMDB_IMPORT_ACCESS_TOKEN:-}
      TMDB_IMPORT_API_KEY: ${TMDB_IMPORT_API_KEY:-}
      # Если сервер не достаёт до TMDB напрямую: NODE_USE_ENV_PROXY=1 и HTTPS_PROXY=http://host:port
      NODE_USE_ENV_PROXY: ${NODE_USE_ENV_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
    volumes:
      # Загруженные постеры; без volume пропадут при обновлении образа
      - cinetrack_media:/app/media
    ports:
      - "5200:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cinetrack

  web:
    image: registry.xander9112.keenetic.link/cinetrack-web:1.0.0-1
    container_name: cinetrack_web
    restart: unless-stopped
    ports:
      - "5210:80"
    networks:
      - cinetrack

networks:
  cinetrack:
    driver: bridge

volumes:
  cinetrack_db_data:
  cinetrack_media:
