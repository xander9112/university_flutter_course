# Пакеты, которым разрешено выполнять сборочные скрипты при установке (pnpm 10+ по умолчанию
# их блокирует): esbuild и sharp скачивают свои бинарники под платформу.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
# pnpm 11+ по умолчанию не ставит версии, вышедшие меньше суток назад; эти исключения
# добавил сам pnpm при установке свежего Next — их можно убрать, когда версии «отлежатся».
minimumReleaseAgeExclude:
  - '@next/env@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - next@16.3.8
